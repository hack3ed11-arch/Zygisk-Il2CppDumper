name: Build Zygisk module

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'GamePackageName (安装后的包名)'
        required: true
        default: 'com.leiting.xian'
      unity_version:
        description: 'UnityVersion (必须是 module/src/main/cpp/il2cppapi 下的目录名)'
        required: true
        default: '2021.2.0f1'
      above_2018_3:
        description: 'Unity >= 2018.3 (yes/no)'
        required: true
        default: 'yes'

env:
  NDK_VERSION: '25.1.8937393'
  CMAKE_VERSION: '3.18.1'
  COMPILE_SDK: '30'
  BUILD_TOOLS: '30.0.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sdkmanager (cmdline-tools 16) 要求 JDK 17；Gradle 7.1.1 + AGP 4.2.2 只能用 JDK 11。
      # 所以先用 17 装 SDK 组件，再切回 11 编译。
      - name: JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          set -eux
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-$COMPILE_SDK" \
            "build-tools;$BUILD_TOOLS" \
            "ndk;$NDK_VERSION" \
            "cmake;$CMAKE_VERSION"
          sdkmanager --list_installed | grep -E 'ndk|cmake|platforms;android-'

      - name: JDK 11 (for Gradle/AGP 4.2.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Patch game.h
        env:
          PKG: ${{ inputs.package_name }}
          UV: ${{ inputs.unity_version }}
          A2018: ${{ inputs.above_2018_3 }}
        run: |
          set -eu
          F=module/src/main/cpp/game.h
          if [ ! -d "module/src/main/cpp/il2cppapi/$UV" ]; then
            echo "::error::il2cppapi/$UV 不存在，可用版本："
            ls module/src/main/cpp/il2cppapi | tr '\n' ' '
            exit 1
          fi
          sed -i -E "s|^#define GamePackageName .*|#define GamePackageName \"$PKG\"|" "$F"
          sed -i -E "s|^#define UnityVersion .*|#define UnityVersion $UV|" "$F"
          if [ "$A2018" = "yes" ]; then
            sed -i -E "s|^// *#define VersionAbove2018dot3|#define VersionAbove2018dot3|" "$F"
          else
            sed -i -E "s|^#define VersionAbove2018dot3|// #define VersionAbove2018dot3|" "$F"
          fi
          echo '--- game.h ---'
          grep -nE 'define (GamePackageName|UnityVersion|VersionAbove2018dot3)' "$F"

      - name: Build release
        run: |
          set -eux
          java -version
          chmod +x gradlew
          ./gradlew :module:assembleRelease --no-daemon --stacktrace

      - name: Show output
        run: ls -la out/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper-${{ inputs.package_name }}
          path: out/*.zip
          if-no-files-found: error
